[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-orchestration"
version = "0.1.0"
description = "Agent-agnostic orchestration and worker-not-tester QA gates"
requires-python = ">=3.8"

[project.scripts]
aoa = "aoa_cli.cli:main"

[tool.setuptools]
packages = ["aoa_cli"]
